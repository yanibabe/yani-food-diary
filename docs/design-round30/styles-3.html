<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SnapCal styles 3</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@200;300;400;500;600&family=Prompt:wght@300;400;500;600&family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Anuphan:wght@300;400;500;600&family=Mali:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#ECEAE4;color:#222;font-family:"IBM Plex Sans Thai",sans-serif;padding:24px 16px 60px}
h1{font-size:22px;font-weight:600;margin-bottom:4px}
.lead{color:#666;font-size:14px;margin-bottom:28px}
.style{margin:0 auto 44px;max-width:900px}
.style h2{font-size:20px;font-weight:600;display:flex;gap:10px;align-items:center}
.num{background:#222;color:#fff;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-size:15px}
.style p.why{color:#555;font-size:14px;margin:6px 0 14px 40px}
.row{display:flex;gap:20px;flex-wrap:wrap;margin-left:40px}
.cap{font-size:12px;color:#777;margin-bottom:6px;text-align:center}
.screen{width:280px;border-radius:30px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);box-shadow:0 10px 30px rgba(0,0,0,.08);position:relative}
.screen>.in{position:relative}
.ch{display:block}
.muted{color:var(--muted)}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row2{display:flex;justify-content:space-between;align-items:baseline}
.chev{color:var(--muted)}
.g{background:rgba(255,255,255,.5);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.85)}
.blob{position:absolute;inset:0}
</style>
</head>
<body>
<h1>SnapCal — 6 more ideas (13–18)</h1>
<p class="lead">Mixed from what you liked: 8 Liquid Glass, 10 Calm Minimal, 11 Cute Pills — plus a few new moods.</p>
<div id="out"></div>

<script>
const CH = "../../public/character-lines.png";
const meals = [
  {slot:"เช้า", name:"โจ๊กหมูใส่ไข่", k:280},
  {slot:"กลางวัน", name:"ข้าวกะเพราไก่ ไข่ดาว", k:560},
  {slot:"เย็น", name:"สลัดอกไก่ น้ำใส", k:350},
  {slot:"ของว่าง", name:"กรีกโยเกิร์ต + กล้วย", k:190},
];
const T = {k:1380, target:1600, p:94, c:148, f:44};
const M = [["โปรตีน",T.p],["คาร์บ",T.c],["ไขมัน",T.f]];
const fmt = n => n.toLocaleString("en-US");
const pct = Math.round(T.k / T.target * 100);
const img = (s, extra="") => `<img class="ch" src="${CH}" width="${s}" height="${s}" style="${extra}" alt="">`;
function ring(size, stroke, track, color, inner, frac=T.k/T.target){
  const r=(size-stroke)/2, C=2*Math.PI*r, off=C*(1-frac);
  return `<div style="position:relative;width:${size}px;height:${size}px;flex-shrink:0">
  <svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>
  <div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center">${inner}</div></div>`;
}
const rows = (items, sep, pad="11px 0", w=400) => items.map((t,i)=>`<div class="row2" style="padding:${pad};${i?`border-top:1px solid ${sep};`:""}font-size:14px;font-weight:${w}"><span>${t}</span><span class="chev">›</span></div>`).join("");
const mealRows = (sep, w=400, numColor="inherit") => meals.map((m,i)=>`<div class="row2" style="padding:9px 0;${i?`border-top:1px solid ${sep};`:""}font-size:13px;font-weight:${w}"><span><span class="muted" style="display:inline-block;width:52px;font-size:11px">${m.slot}</span>${m.name}</span><span style="color:${numColor}">${m.k}</span></div>`).join("");
const dots = (n, on, off, size=10) => `<div style="display:flex;gap:4px">${Array.from({length:n},(_, i)=>`<div style="width:${size}px;height:${size}px;border-radius:50%;background:${i<Math.round(pct/100*n)?on:off}"></div>`).join("")}</div>`;

const S = [
/* 13 Frosted Calm = 8 + 10 */ {
 name:"Frosted Calm", why:"8 + 10: the calm beige and thin numbers of Calm Minimal, on soft frosted glass. Quiet, airy, a little dreamy.",
 v:{bg:"#F4EFE7",ink:"#2B2724",muted:"#9C948A",font:"'IBM Plex Sans Thai',sans-serif"},
 bg:"radial-gradient(circle at 20% 12%,#F3D9C8 0,transparent 42%),radial-gradient(circle at 85% 55%,#E3E0F2 0,transparent 45%),radial-gradient(circle at 30% 95%,#E6EEDD 0,transparent 45%)",
 share(){return `<div style="padding:24px 18px">
  <div style="text-align:center">${img(54,"margin:0 auto")}<div class="muted" style="font-size:11px;letter-spacing:3px;margin-top:4px">YANI · 16 · 11 · 2026</div></div>
  <div class="g" style="border-radius:26px;padding:20px 16px;margin:14px 0 10px;text-align:center"><div style="font-size:50px;font-weight:200;line-height:1">${fmt(T.k)}</div><div class="muted" style="font-size:12px;margin-top:4px">kcal · เป้า ${fmt(T.target)}</div>
  <div style="height:2px;background:rgba(43,39,36,.12);margin:14px 20px 0"><div style="width:${pct}%;height:100%;background:#2B2724"></div></div></div>
  <div class="mac">${M.map(([l,v])=>`<div class="g" style="border-radius:18px;padding:10px;text-align:center"><div style="font-size:18px;font-weight:300">${v}</div><div class="muted" style="font-size:10px">${l} g</div></div>`).join("")}</div>
  <div class="g" style="border-radius:22px;padding:4px 14px;margin-top:10px">${mealRows("rgba(43,39,36,.08)",300)}</div>
  <div class="muted" style="font-size:10px;text-align:center;margin-top:12px;letter-spacing:2px">SNAPCAL</div></div>`},
 profile(){return `<div style="padding:28px 18px">
  <div style="text-align:center">${img(124,"margin:0 auto")}<div style="font-size:24px;font-weight:300;margin-top:6px">Yani</div><div class="muted" style="font-size:12px">28 · 160 ซม. · 55 กก.</div></div>
  <div class="g" style="border-radius:24px;display:grid;grid-template-columns:1fr 1px 1fr;margin:18px 0 10px;padding:14px 0;text-align:center"><div><div style="font-size:26px;font-weight:200">1,600</div><div class="muted" style="font-size:11px">kcal ต่อวัน</div></div><div style="background:rgba(43,39,36,.12)"></div><div><div style="font-size:26px;font-weight:200">52</div><div class="muted" style="font-size:11px">กก. เป้าหมาย</div></div></div>
  <div class="g" style="border-radius:22px;padding:2px 14px">${rows(["ข้อมูลร่างกาย","อาหารที่เลี่ยง","ภาษา","สำรองข้อมูล"],"rgba(43,39,36,.08)","11px 0",300)}</div></div>`}
},
/* 14 Pastel Glass Pills = 8 + 11 */ {
 name:"Glass Pills", why:"8 + 11: round pastel pills and dots, floating on frosted glass. Cute, light, and modern.",
 v:{bg:"#FBF5FA",ink:"#2A2430",muted:"#9A90A3",font:"'Prompt',sans-serif"},
 bg:"radial-gradient(circle at 85% 8%,#FFD3E2 0,transparent 42%),radial-gradient(circle at 10% 45%,#FFF0B8 0,transparent 42%),radial-gradient(circle at 80% 92%,#CFE6FF 0,transparent 48%)",
 share(){const pill=(l,v,c)=>`<div class="g" style="border-radius:99px;padding:8px 14px;display:flex;justify-content:space-between;font-size:13px"><span style="display:flex;align-items:center;gap:8px"><span style="width:9px;height:9px;border-radius:50%;background:${c}"></span>${l}</span><b style="font-weight:500">${v} g</b></div>`;
  return `<div style="padding:22px 18px">
  <div style="display:flex;align-items:center;gap:10px"><div class="g" style="border-radius:50%;padding:4px">${img(44)}</div><div><div style="font-size:16px;font-weight:500">วันนี้ของ Yani</div><div class="muted" style="font-size:12px">16 พ.ย.</div></div></div>
  <div class="g" style="border-radius:26px;padding:16px;margin:14px 0 10px"><div style="display:flex;align-items:baseline;gap:6px"><span style="font-size:42px;font-weight:500;line-height:1">${fmt(T.k)}</span><span class="muted" style="font-size:13px">/ ${fmt(T.target)} kcal</span></div><div style="margin-top:10px">${dots(16,"#FF9EB5","rgba(255,255,255,.9)")}</div></div>
  <div style="display:grid;gap:6px">${pill("โปรตีน",T.p,"#FF9EB5")}${pill("คาร์บ",T.c,"#F5C842")}${pill("ไขมัน",T.f,"#7DB8F0")}</div>
  <div class="g" style="border-radius:22px;padding:4px 14px;margin-top:10px">${mealRows("rgba(255,255,255,.95)")}</div>
  <div class="muted" style="font-size:10px;text-align:center;margin-top:10px">SnapCal ♡</div></div>`},
 profile(){return `<div style="padding:22px 18px">
  <div class="g" style="border-radius:32px;padding:16px;text-align:center">${img(112,"margin:0 auto")}<div style="font-size:22px;font-weight:500">Yani</div><div style="font-size:12px" class="muted">ลดน้ำหนักอย่างใจดี</div></div>
  <div style="display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;justify-content:center">${["28 ปี","160 ซม.","55 กก.","BMI 21.5"].map(t=>`<span class="g" style="border-radius:99px;padding:5px 12px;font-size:12px">${t}</span>`).join("")}</div>
  <div class="g" style="border-radius:24px;padding:14px"><div class="row2"><span class="muted" style="font-size:12px">เป้าต่อวัน</span><span style="font-size:22px;font-weight:500">1,600 kcal</span></div>
  <div style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px"><span>55</span><div style="flex:1;height:8px;background:rgba(255,255,255,.9);border-radius:9px"><div style="width:40%;height:100%;background:#FF9EB5;border-radius:9px"></div></div><span>52 กก.</span></div></div>
  <div class="g" style="border-radius:22px;padding:2px 14px;margin-top:10px">${rows(["อาหารที่เลี่ยง","ภาษา","สำรองข้อมูล"],"rgba(255,255,255,.95)")}</div></div>`}
},
/* 15 Milk Tea */ {
 name:"Milk Tea", why:"New: warm latte and cream colors, soft round pills, thin text. Cozy café feel — calm like 10, cute like 11.",
 v:{bg:"#F7F0E6",ink:"#4A3A2E",muted:"#A8957F",font:"'Anuphan',sans-serif"},
 share(){return `<div style="padding:22px 18px">
  <div class="row2"><div><div style="font-size:16px;font-weight:500">Yani's day</div><div class="muted" style="font-size:12px">16 พ.ย. 2026</div></div>${img(48)}</div>
  <div style="display:flex;align-items:center;gap:14px;margin:16px 0">${ring(104,8,"#EADFCF","#B98B62",`<div><div style="font-size:22px;font-weight:500;line-height:1">${pct}%</div></div>`)}<div><div style="font-size:34px;font-weight:300;line-height:1">${fmt(T.k)}</div><div class="muted" style="font-size:12px">/ ${fmt(T.target)} kcal</div><div style="display:inline-block;margin-top:6px;background:#EADFCF;border-radius:99px;padding:2px 10px;font-size:11px">เหลือ ${fmt(T.target-T.k)}</div></div></div>
  <div class="mac">${M.map(([l,v],i)=>`<div style="background:${["#F1DDD0","#F3E7C8","#DFE6D6"][i]};border-radius:99px;padding:8px 0;text-align:center"><div style="font-size:15px;font-weight:500">${v}g</div><div style="font-size:10px;opacity:.75">${l}</div></div>`).join("")}</div>
  <div style="background:#FFFBF5;border-radius:22px;padding:4px 14px;margin-top:12px">${mealRows("#F1E7DA",300)}</div>
  <div class="muted" style="font-size:10px;text-align:center;margin-top:10px">SnapCal</div></div>`},
 profile(){return `<div style="padding:22px 18px">
  <div style="background:#EADFCF;border-radius:30px;padding:18px 16px;display:flex;align-items:center;gap:12px">${img(96,"background:#FFFBF5;border-radius:50%")}<div><div style="font-size:22px;font-weight:500">Yani</div><div style="font-size:12px" class="muted">28 ปี · 160 ซม.</div></div></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0">${[["น้ำหนัก","55 → 52"],["BMI","21.5"]].map(([l,v])=>`<div style="background:#FFFBF5;border-radius:20px;padding:12px"><div class="muted" style="font-size:11px">${l}</div><div style="font-size:19px;font-weight:400">${v}</div></div>`).join("")}</div>
  <div style="background:#4A3A2E;color:#F7F0E6;border-radius:22px;padding:14px 16px" class="row2"><span style="font-size:12px;opacity:.8">เป้าต่อวัน</span><span style="font-size:22px;font-weight:300">1,600 kcal</span></div>
  <div style="background:#FFFBF5;border-radius:22px;padding:2px 14px;margin-top:10px">${rows(["อาหารที่เลี่ยง","ภาษา","สำรองข้อมูล"],"#F1E7DA","11px 0",300)}</div></div>`}
},
/* 16 Cloud */ {
 name:"Cloud Pastel", why:"New: very light sky-blue and lilac, floating white cards, thin rounded font. Feels soft and weightless.",
 v:{bg:"#EEF2FB",ink:"#28304A",muted:"#8D95AD",font:"'Prompt',sans-serif"},
 share(){return `<div style="padding:22px 18px">
  <div style="text-align:center">${img(70,"margin:0 auto;background:#fff;border-radius:50%")}<div style="font-size:16px;font-weight:500;margin-top:6px">วันนี้ของ Yani</div><div class="muted" style="font-size:12px">16 พ.ย. 2026</div></div>
  <div style="background:#fff;border-radius:28px;padding:18px;margin:14px 0 10px;text-align:center;box-shadow:0 10px 24px rgba(90,110,170,.1)"><div style="font-size:46px;font-weight:300;line-height:1;color:#6B7FD7">${fmt(T.k)}</div><div class="muted" style="font-size:12px">/ ${fmt(T.target)} kcal</div>
  <div style="height:8px;background:#EEF2FB;border-radius:9px;margin-top:12px"><div style="width:${pct}%;height:100%;background:linear-gradient(90deg,#A9B8F5,#C9A9F0);border-radius:9px"></div></div></div>
  <div class="mac">${M.map(([l,v],i)=>`<div style="background:#fff;border-radius:20px;padding:10px;text-align:center;box-shadow:0 6px 16px rgba(90,110,170,.08)"><div style="font-size:18px;font-weight:400;color:${["#D36D96","#C29A2E","#5E92C9"][i]}">${v}g</div><div class="muted" style="font-size:10px">${l}</div></div>`).join("")}</div>
  <div style="background:#fff;border-radius:24px;padding:4px 14px;margin-top:10px;box-shadow:0 6px 16px rgba(90,110,170,.08)">${mealRows("#EEF2FB",300)}</div>
  <div class="muted" style="font-size:10px;text-align:center;margin-top:10px">SnapCal ☁</div></div>`},
 profile(){return `<div style="padding:22px 18px">
  <div style="text-align:center"><div style="width:140px;height:140px;margin:0 auto;background:#fff;border-radius:50%;display:grid;place-items:center;box-shadow:0 12px 28px rgba(90,110,170,.15)">${img(116)}</div><div style="font-size:23px;font-weight:400;margin-top:10px">Yani</div><div class="muted" style="font-size:12px">55 → 52 กก.</div></div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0">${[["1,600","kcal/วัน"],["21.5","BMI"],["28","ปี"]].map(([v,l])=>`<div style="background:#fff;border-radius:20px;padding:10px;text-align:center"><div style="font-size:17px;font-weight:400">${v}</div><div class="muted" style="font-size:10px">${l}</div></div>`).join("")}</div>
  <div style="background:#fff;border-radius:22px;padding:2px 14px">${rows(["ข้อมูลร่างกาย","อาหารที่เลี่ยง","ภาษา","สำรองข้อมูล"],"#EEF2FB","11px 0",300)}</div></div>`}
},
/* 17 Dot Notebook */ {
 name:"Dot Notebook", why:"New: cream dotted paper like a bullet journal, thin lines, small cute doodles. Calm and personal — fits your stationery brand.",
 v:{bg:"#FBF8F1",ink:"#2E2B27",muted:"#A39C90",font:"'IBM Plex Sans Thai',sans-serif"},
 bg:"radial-gradient(#DCD5C7 1px,transparent 1.2px) 0 0/14px 14px",
 share(){return `<div style="padding:22px 18px">
  <div class="row2"><div><div style="font-family:'Mali';font-size:18px">Yani's food log</div><div class="muted" style="font-size:12px">16 · 11 · 2026</div></div>${img(54)}</div>
  <div style="background:#fff;border:1px solid #E7E0D3;border-radius:18px;padding:16px;margin:12px 0"><div class="row2"><span class="muted" style="font-size:12px">รวมวันนี้</span><span style="font-family:'Mali';font-size:12px;background:#FFF0A8;padding:0 6px;border-radius:4px">${pct}% ✓</span></div><div style="font-size:42px;font-weight:300;line-height:1.1">${fmt(T.k)} <span style="font-size:13px" class="muted">/ ${fmt(T.target)} kcal</span></div></div>
  <div class="mac">${M.map(([l,v])=>`<div style="background:#fff;border:1px solid #E7E0D3;border-radius:14px;padding:8px;text-align:center"><div style="font-size:17px;font-weight:400">${v}g</div><div class="muted" style="font-size:10px">${l}</div></div>`).join("")}</div>
  <div style="background:#fff;border:1px solid #E7E0D3;border-radius:18px;padding:4px 14px;margin-top:10px">${meals.map((m,i)=>`<div class="row2" style="padding:9px 0;${i?"border-top:1px dashed #E7E0D3;":""}font-size:13px;font-weight:300"><span><span style="font-family:'Mali';font-size:11px;display:inline-block;width:52px">${m.slot}</span>${m.name}</span><span>${m.k}</span></div>`).join("")}</div>
  <div style="font-family:'Mali';font-size:11px;text-align:center;margin-top:10px" class="muted">SnapCal ✎</div></div>`},
 profile(){return `<div style="padding:24px 18px">
  <div style="text-align:center"><div style="display:inline-block;background:#fff;border:1px solid #E7E0D3;border-radius:22px;padding:8px;transform:rotate(-2deg)">${img(116)}</div><div style="font-family:'Mali';font-size:24px;margin-top:8px">Yani</div><div class="muted" style="font-size:12px">28 · 160 ซม. · 55 กก.</div></div>
  <div style="background:#fff;border:1px solid #E7E0D3;border-radius:18px;padding:14px;margin:16px 0 10px"><div class="row2"><span class="muted" style="font-size:12px">เป้าต่อวัน</span><span style="font-size:22px;font-weight:300">1,600 kcal</span></div>
  <div class="row2" style="margin-top:8px"><span class="muted" style="font-size:12px">น้ำหนัก</span><span style="font-family:'Mali';font-size:13px">55 → <span style="background:#FFF0A8;padding:0 4px;border-radius:4px">52 กก.</span></span></div></div>
  <div style="background:#fff;border:1px solid #E7E0D3;border-radius:18px;padding:2px 14px">${rows(["ข้อมูลร่างกาย","อาหารที่เลี่ยง","ภาษา","สำรองข้อมูล"],"#F1ECE2","11px 0",300)}</div></div>`}
},
/* 18 Sorbet glass */ {
 name:"Sorbet Glass", why:"New: peach and mint glass, a little more color than 8, round pills. Fresh, sweet, and still very clean.",
 v:{bg:"#FFF6F1",ink:"#2D2A2A",muted:"#9C8F8C",font:"'Noto Sans Thai',sans-serif"},
 bg:"radial-gradient(circle at 10% 10%,#FFC8B0 0,transparent 45%),radial-gradient(circle at 95% 40%,#BFF0DC 0,transparent 45%),radial-gradient(circle at 30% 100%,#FFE3A6 0,transparent 45%)",
 share(){return `<div style="padding:22px 18px">
  <div class="row2"><div><div style="font-size:17px;font-weight:600">Yani · วันนี้</div><div class="muted" style="font-size:12px">16 พ.ย. 2026</div></div><div class="g" style="border-radius:20px;padding:4px">${img(44)}</div></div>
  <div class="g" style="border-radius:28px;padding:16px;margin:14px 0 10px;display:flex;align-items:center;gap:14px">${ring(92,10,"rgba(255,255,255,.75)","#FF8C69",`<div style="font-size:15px;font-weight:600">${pct}%</div>`)}<div><div style="font-size:34px;font-weight:600;line-height:1">${fmt(T.k)}</div><div class="muted" style="font-size:12px">/ ${fmt(T.target)} kcal</div></div></div>
  <div style="display:flex;gap:6px">${M.map(([l,v])=>`<div class="g" style="flex:1;border-radius:99px;padding:7px 0;text-align:center;font-size:12px"><b style="font-weight:600">${v}g</b> <span class="muted">${l}</span></div>`).join("")}</div>
  <div class="g" style="border-radius:24px;padding:4px 14px;margin-top:10px">${mealRows("rgba(255,255,255,.95)")}</div>
  <div class="muted" style="font-size:10px;text-align:center;margin-top:10px">SnapCal</div></div>`},
 profile(){return `<div style="padding:22px 18px">
  <div class="g" style="border-radius:32px;padding:16px;display:flex;align-items:center;gap:12px">${img(100)}<div><div style="font-size:22px;font-weight:600">Yani</div><div class="muted" style="font-size:12px">28 ปี · 160 ซม.</div><div style="display:inline-block;margin-top:4px;background:#BFF0DC;color:#1F6B4E;border-radius:99px;padding:1px 10px;font-size:11px">BMI 21.5 ปกติ</div></div></div>
