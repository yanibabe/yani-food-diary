<!doctype html>
<!--
  Buddy maker — APPROVED design prototype (2026-11-13, Yani said "เอาาา").
  This is the reference for Round 20. Open it in a browser to play with it.
  Copy the shapes, colors, eyes, mouths and add-ons from here into the real app.
  Rule from Yani: add-ons are flat soft color, NO dark outline.
-->
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buddy maker prototype</title>
<style>
body{font-family:system-ui,sans-serif;background:#fff;color:#2a2622;margin:16px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.row button{font-size:13px;padding:4px 10px;min-height:30px;border:1px solid #ddd;background:#fff;border-radius:8px}
.row button.on{background:#FEF6E0;border-color:#FAC775}
.lab{font-size:13px;color:#8a8580}
.sw{width:28px;height:28px;padding:0!important;border-radius:50%!important}
.sw.on{outline:2px solid #2a2622;outline-offset:2px}
</style>
</head>
<body>
<div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">
<div style="background:#f8f6f3;border-radius:20px;padding:12px"><svg id="pv" width="190" height="190" viewBox="0 0 100 100"></svg></div>
<div style="flex:1;min-width:240px">
<div class="lab">รูปร่าง</div><div class="row" id="shape"></div>
<div class="lab">สี</div><div class="row" id="color"></div>
<div class="lab">ตา</div><div class="row" id="eyes"></div>
<div class="lab">ปาก</div><div class="row" id="mouth"></div>
<div class="lab">บนหัว (เลือก 1 อย่าง)</div><div class="row" id="head"></div>
<div class="lab">ของแต่งอื่นๆ (เลือกได้หลายอัน)</div><div class="row" id="extra"></div>
</div></div>
<script>
// Shapes: d = body path in a 100x100 box. dy = how far to move the face down.
// top = y of the top of the head (for head add-ons). ex/ey = left side point (for earrings).
const S={blob:{t:"ก้อนนุ่ม",d:"M50 14 C72 12 88 28 86 52 C84 74 70 88 48 86 C26 84 12 70 14 48 C16 28 30 15 50 14Z",dy:0,top:14,ex:15,ey:58},
mochi:{t:"โมจิ",d:"M14 66 C14 40 30 24 50 24 C70 24 86 40 86 66 C86 80 74 84 50 84 C26 84 14 80 14 66Z",dy:8,top:24,ex:15,ey:64},
onigiri:{t:"ข้าวปั้น",d:"M50 14 C58 14 88 64 86 74 C84 84 70 86 50 86 C30 86 16 84 14 74 C12 64 42 14 50 14Z",dy:8,top:16,ex:22,ey:64},
bun:{t:"ซาลาเปา",d:"M12 70 C12 46 30 30 50 22 C70 30 88 46 88 70 C88 82 70 86 50 86 C30 86 12 82 12 70Z",dy:10,top:22,ex:13,ey:66},
cloud:{t:"เมฆ",d:"M24 80 C8 80 8 58 22 56 C18 38 38 30 46 40 C52 22 78 28 74 46 C92 46 92 74 78 80Z",dy:10,top:30,ex:11,ey:64},
jelly:{t:"เยลลี่",d:"M18 50 C18 28 32 16 50 16 C68 16 82 28 82 50 L82 80 C76 86 72 76 66 82 C60 88 56 78 50 82 C44 88 40 78 34 82 C28 88 24 76 18 82Z",dy:0,top:16,ex:18,ey:56}};
const C=["#F4C0D1","#FAC775","#9FE1CB","#B5D4F4","#CECBF6","#F5C4B3","#ffffff"];
const k='stroke="#2a2622" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"';
const E={dot:{t:"จุด",s:'<circle cx="40" cy="52" r="3" fill="#2a2622"/><circle cx="60" cy="52" r="3" fill="#2a2622"/>'},
shine:{t:"ตาวิบวับ",s:'<ellipse cx="40" cy="52" rx="4.2" ry="5" fill="#2a2622"/><ellipse cx="60" cy="52" rx="4.2" ry="5" fill="#2a2622"/><circle cx="41.5" cy="50" r="1.6" fill="#fff"/><circle cx="61.5" cy="50" r="1.6" fill="#fff"/>'},
happy:{t:"ยิ้มตาปิด",s:`<path d="M35 53 Q40 47 45 53 M55 53 Q60 47 65 53" ${k}/>`},
calm:{t:"สงบ",s:`<path d="M35 50 Q40 55 45 50 M55 50 Q60 55 65 50" ${k}/>`},
squint:{t:"> <",s:`<path d="M36 48 L43 52 L36 56 M64 48 L57 52 L64 56" ${k}/>`},
wink:{t:"ขยิบตา",s:`<circle cx="40" cy="52" r="3" fill="#2a2622"/><path d="M55 53 Q60 48 65 53" ${k}/>`}};
const M={smile:{t:"ยิ้ม",s:`<path d="M45 61 Q50 66 55 61" ${k}/>`},
cat:{t:"ω",s:`<path d="M44 61 Q47 65 50 61 Q53 65 56 61" ${k}/>`},
open:{t:"ยิ้มกว้าง",s:'<path d="M44 60 Q50 70 56 60Z" fill="#D85A30" stroke="#2a2622" stroke-width="1.6" stroke-linejoin="round"/>'},
o:{t:"o",s:'<ellipse cx="50" cy="63" rx="2.4" ry="3" fill="#2a2622"/>'},
flat:{t:"เฉยๆ",s:`<path d="M46 62 L54 62" ${k}/>`},
tongue:{t:"แลบลิ้น",s:`<path d="M44 60 Q50 65 56 60" ${k}/><path d="M48 62.5 Q50 69 52 62.5Z" fill="#ED93B1"/>`}};
const H={none:{t:"ไม่มี",f:()=>""},
bow:{t:"โบว์",f:y=>`<g transform="translate(68 ${y+7}) rotate(14)"><path d="M0 0 C-3 -8 -12 -8 -11 0 C-12 8 -3 8 0 0Z M0 0 C3 -8 12 -8 11 0 C12 8 3 8 0 0Z" fill="#F4A6B8"/><ellipse rx="3" ry="3.4" fill="#ED93B1"/></g>`},
sprout:{t:"ใบไม้",f:y=>{y+=2;return `<path d="M50 ${y} L50 ${y-7}" stroke="#97C459" stroke-width="2.4" stroke-linecap="round"/><path d="M50 ${y-6} C46 ${y-15} 38 ${y-13} 37 ${y-9} C40 ${y-4} 46 ${y-4} 50 ${y-6}Z" fill="#97C459"/><path d="M50 ${y-6} C54 ${y-15} 62 ${y-13} 63 ${y-9} C60 ${y-4} 54 ${y-4} 50 ${y-6}Z" fill="#B5D98A"/>`}},
flower:{t:"ดอกไม้",f:y=>{const cx=33,cy=y+9;let p="";for(let i=0;i<5;i++){const a=i*72*Math.PI/180;p+=`<circle cx="${(cx+4.2*Math.sin(a)).toFixed(1)}" cy="${(cy-4.2*Math.cos(a)).toFixed(1)}" r="3.4" fill="#F4A6B8"/>`}return p+`<circle cx="${cx}" cy="${cy}" r="2.6" fill="#FAC775"/>`}},
hat:{t:"หมวก",f:y=>`<g transform="rotate(-8 50 ${y})"><ellipse cx="50" cy="${y+1}" rx="18" ry="7.5" fill="#D98880"/><ellipse cx="50" cy="${y+3.5}" rx="15" ry="3" fill="#C97470"/><circle cx="53" cy="${y-6.5}" r="2.2" fill="#D98880"/></g>`},
clip:{t:"กิ๊บ",f:y=>`<rect x="26" y="${y+8}" width="12" height="3.6" rx="1.8" fill="#FAC775" transform="rotate(-30 32 ${y+10})"/><rect x="29" y="${y+13}" width="12" height="3.6" rx="1.8" fill="#F4A6B8" transform="rotate(-30 35 ${y+15})"/>`},
cherry:{t:"เชอร์รี่",f:y=>`<path d="M45 ${y-1} Q47 ${y-10} 52 ${y-14} Q53 ${y-8} 56 ${y}" stroke="#8DB860" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M52 ${y-14} C56 ${y-18} 61 ${y-16} 62 ${y-13} C58 ${y-11} 55 ${y-12} 52 ${y-14}Z" fill="#97C459"/><circle cx="45" cy="${y+1}" r="4.4" fill="#E86B6B"/><circle cx="56" cy="${y+2}" r="4.4" fill="#F07F7F"/><circle cx="43.6" cy="${y-0.4}" r="1.2" fill="#fff" opacity=".7"/>`},
strawberry:{t:"สตรอว์เบอร์รี่",f:y=>`<path d="M50 ${y+4} C42 ${y-2} 42 ${y-10} 50 ${y-10} C58 ${y-10} 58 ${y-2} 50 ${y+4}Z" fill="#F07F7F"/><path d="M44 ${y-10} Q47 ${y-14} 50 ${y-11} Q53 ${y-14} 56 ${y-10} Q50 ${y-8} 44 ${y-10}Z" fill="#97C459"/><circle cx="47" cy="${y-5}" r=".8" fill="#FFE3A3"/><circle cx="53" cy="${y-5}" r=".8" fill="#FFE3A3"/><circle cx="50" cy="${y-1}" r=".8" fill="#FFE3A3"/>`},
orange:{t:"ส้ม",f:y=>`<circle cx="50" cy="${y-3}" r="6.5" fill="#F5A04A"/><circle cx="48" cy="${y-5}" r="1.4" fill="#fff" opacity=".5"/><path d="M50 ${y-9} C52 ${y-14} 58 ${y-14} 59 ${y-11} C56 ${y-8} 53 ${y-9} 50 ${y-9}Z" fill="#97C459"/>`}};
const X={blush:{t:"แก้มชมพู"},nose:{t:"จมูก"},glasses:{t:"แว่น"},earrings:{t:"ต่างหู"},coffee:{t:"แก้วกาแฟ"}};
let st={shape:"blob",color:C[3],eyes:"shine",mouth:"smile",head:"strawberry",extra:new Set(["blush","coffee"])};
function draw(){const s=S[st.shape];let o=`<path d="${s.d}" fill="${st.color}" stroke="${st.color=="#ffffff"?"#e2ddd5":"none"}" stroke-width="1.5"/>`;
if(st.shape=="onigiri")o+='<path d="M34 72 L66 72 L66 86 Q50 87 34 86Z" fill="#2C4A3A"/>';
if(st.shape=="bun")o+='<path d="M44 30 Q50 34 56 30 M47 26 Q50 30 53 26" stroke="#0003" stroke-width="1.6" fill="none" stroke-linecap="round"/>';
let f="";if(st.extra.has("blush"))f+='<ellipse cx="33" cy="60" rx="5" ry="3" fill="#ED93B1" opacity=".55"/><ellipse cx="67" cy="60" rx="5" ry="3" fill="#ED93B1" opacity=".55"/>';
f+=E[st.eyes].s;if(st.extra.has("nose"))f+='<ellipse cx="50" cy="57" rx="2.2" ry="1.6" fill="#D85A30" opacity=".7"/>';f+=M[st.mouth].s;
if(st.extra.has("glasses"))f+='<g stroke="#2a2622" stroke-width="1.8" fill="none"><circle cx="40" cy="52" r="8"/><circle cx="60" cy="52" r="8"/><path d="M48 51 Q50 49 52 51"/></g>';
o+=`<g transform="translate(0 ${s.dy})">${f}</g>`;
if(st.extra.has("earrings")){[s.ex,100-s.ex].forEach(x=>{o+=`<circle cx="${x}" cy="${s.ey+3}" r="1.6" fill="#E6B450"/><circle cx="${x}" cy="${s.ey+8}" r="3" fill="#F6E7C8"/>`})}
o+=H[st.head].f(s.top);
if(st.extra.has("coffee"))o+='<g transform="translate(70 66) rotate(8)"><path d="M3 4 L17 4 L15 22 Q10 24 5 22Z" fill="#F7F3EC"/><path d="M3.8 10 L16.2 10 L15.4 17 L4.6 17Z" fill="#C9A27E"/><rect x="1.5" y="1" width="17" height="4" rx="2" fill="#8A6A50"/><path d="M8 -2 Q6 -5 8 -8 M12 -2 Q14 -5 12 -8" stroke="#C8C2B8" stroke-width="1.4" fill="none" stroke-linecap="round"/></g>';
document.getElementById("pv").innerHTML=o;}
function mk(id,obj,key){const r=document.getElementById(id);Object.entries(obj).forEach(([v,x])=>{const b=document.createElement("button");b.textContent=x.t;b.dataset.v=v;b.onclick=()=>{if(key=="extra"){st.extra.has(v)?st.extra.delete(v):st.extra.add(v)}else st[key]=v;sync();draw()};r.appendChild(b)})}
mk("shape",S,"shape");mk("eyes",E,"eyes");mk("mouth",M,"mouth");mk("head",H,"head");mk("extra",X,"extra");
const cr=document.getElementById("color");C.forEach(c=>{const b=document.createElement("button");b.className="sw";b.style.background=c;b.dataset.v=c;b.onclick=()=>{st.color=c;sync();draw()};cr.appendChild(b)});
function sync(){["shape","eyes","mouth","head"].forEach(k=>document.querySelectorAll("#"+k+" button").forEach(b=>b.classList.toggle("on",b.dataset.v==st[k])));document.querySelectorAll("#extra button").forEach(b=>b.classList.toggle("on",st.extra.has(b.dataset.v)));document.querySelectorAll("#color button").forEach(b=>b.classList.toggle("on",b.dataset.v==st.color))}
sync();draw();
</script>
</body>
</html>
