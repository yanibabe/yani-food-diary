<!doctype html>
<!--
  Fruit buddy — DRAFT prototype v4 (2026-11-14). v4: she found some fruit SHAPES unnatural (dragon fruit
  spikes looked "too AI"). Now the body is ALWAYS a circle, and "dress as a fruit" adds small details on top.
  (v3 notes below.)
  From the circle doodle-face v2 (pastel, any color, part-only choices). Yani asked to make it ours:
   1. Food touch: the buddy is a FRUIT shape (many fruits, incl. Thai ones), drawn by us.
   2. Face changes with the day — but she still designs her own buddy.
  Idea: "my face + today's mood". She picks everything. The app only swaps EYES + MOUTH on some days
  (her fruit, color, brows, nose stay hers). Can be switched off.
  Kind rule: the buddy is NEVER sad about eating over target — it shows a gentle face instead.
-->
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fruit buddy prototype</title>
<style>
:root{--bg:#f8f6f3;--ink:#2a2622;--muted:#8b857e;--line:#ebe6e0}
*{box-sizing:border-box}
body{font-family:system-ui,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:16px;max-width:560px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 2px}
h2{font-size:17px;margin:0 0 4px}
p.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:16px}
.wall{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wall svg{width:100%;height:auto}
.pv{position:sticky;top:0;z-index:2;display:flex;justify-content:center;background:var(--bg);border-radius:16px;padding:10px;margin-bottom:12px}
.lab{font-size:14px;color:var(--muted);margin:14px 2px 6px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.part{border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px;width:64px;height:46px}
.part.fruit{width:76px;height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px}
.part.fruit svg{width:56px;height:56px}
.part.fruit small{font-size:10px;color:var(--muted);line-height:1.1}
.part.on{border-color:var(--ink);background:#fff7d6;box-shadow:0 0 0 1px var(--ink)}
.part svg{width:100%;height:100%;display:block}
.part .none{font-size:13px;color:var(--muted)}
.sw{width:40px;height:40px;border-radius:50%;border:1px solid #e2ddd5;padding:0}
.sw.on{outline:2px solid var(--ink);outline-offset:2px}
.any{position:relative;width:40px;height:40px;border-radius:50%;overflow:hidden;border:1px solid #e2ddd5;
  background:conic-gradient(#f88,#fd8,#bf8,#8fd,#8cf,#a8f,#f8d,#f88)}
.any.on{outline:2px solid var(--ink);outline-offset:2px}
.any input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.anylab{font-size:13px;color:var(--muted);align-self:center;margin-left:2px}
.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mood{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;background:var(--bg);border-radius:16px;padding:8px 4px}
.mood svg{width:64px;height:64px}
.mood b{font-size:13px}
.mood span{font-size:11px;color:var(--muted);line-height:1.3}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;font-size:15px}
.switch{width:52px;height:32px;border-radius:999px;border:0;background:#ddd6cc;position:relative}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:#2a2622}.switch.on::after{left:23px}
.dice{margin-top:16px;width:100%;min-height:48px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-size:16px}
</style>
</head>
<body>
<h1>เพื่อนผลไม้ของฉัน 🍑</h1>
<p class="sub">ตัวอย่างหน้าตา (ยังไม่ใช่แอปจริง)</p>

<div class="card"><div class="wall" id="wall"></div></div>

<div class="card">
  <div class="pv"><svg id="pv" width="150" height="150" viewBox="-8 -16 116 116"></svg></div>
  <div class="lab">สี</div><div class="row" id="color"></div>
  <div class="lab">ตา</div><div class="row" id="eyes"></div>
  <div class="lab">คิ้ว</div><div class="row" id="brows"></div>
  <div class="lab">จมูก</div><div class="row" id="nose"></div>
  <div class="lab">ปาก</div><div class="row" id="mouth"></div>
  <div class="lab">แก้ม</div><div class="row" id="cheek"></div>
  <div class="lab">แต่งเป็นผลไม้</div><div class="row" id="fruit"></div>
  <button class="dice" id="dice">🎲 สุ่ม</button>
</div>

<div class="card">
  <h2>หน้าเปลี่ยนตามวัน</h2>
  <p class="sub" style="margin-bottom:10px">ผลไม้ สี คิ้ว จมูก ยังเป็นของเรา · เปลี่ยนแค่ตากับปาก</p>
  <div class="moods" id="moods"></div>
  <div class="toggle"><span>ให้หน้าเปลี่ยนตามวัน</span><button class="switch on" id="moodOn" aria-label="เปิดปิด"></button></div>
</div>

<script>
const INK="#2a1d1a";
const L=(d,w=3.2)=>`<path d="${d}" stroke="${INK}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
const D=(x,y,r=3.2)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${INK}"/>`;
const F=(d,c=INK)=>`<path d="${d}" fill="${c}"/>`;
const LEAF="#9FCB7A", LEAF2="#B9DB97", STEM="#A88468";
const leaf=(x,y,rot=0,c=LEAF)=>`<path transform="translate(${x} ${y}) rotate(${rot})" d="M0 0 C4 -8 14 -9 18 -5 C14 1 6 3 0 0Z" fill="${c}"/>`;

function spiky(n,r1,r2,cx=50,cy=52){let p="";for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=i*Math.PI/n;p+=(i?"L":"M")+(cx+r*Math.sin(a)).toFixed(1)+" "+(cy-r*Math.cos(a)).toFixed(1)+" "}return p+"Z"}

// v4: the body is ALWAYS the same hand-cut circle. "Dress as a fruit" adds small soft details.
// Rule: flat soft colors, NO dark outline. Marks use see-through white/black so they suit ANY body color.
const BODY="M50 9 C73 9 91 27 91 50 C91 73 74 91 50 91 C27 91 9 74 9 51 C9 28 26 9 50 9Z";
const SHADE="rgba(0,0,0,.13)", SHINE="rgba(255,255,255,.6)";
function star(cx,cy,n,r1,r2){let p="";for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=i*Math.PI/n;p+=(i?"L":"M")+(cx+r*Math.sin(a)).toFixed(1)+" "+(cy-r*Math.cos(a)).toFixed(1)+" "}return p+"Z"}
// Durian spikes: evenly spaced soft triangles, drawn BEHIND the circle in the body color.
function spikes(color){let o="";const n=18;for(let i=0;i<n;i++){const a=(i+.5)*2*Math.PI/n,w=Math.PI/n*.62;
  const P=(r,t)=>`${(50+r*Math.sin(t)).toFixed(1)} ${(50-r*Math.cos(t)).toFixed(1)}`;
  o+=`<path d="M${P(38,a-w)} L${P(47,a)} L${P(38,a+w)}Z" fill="${color}" stroke="${color}" stroke-width="3" stroke-linejoin="round"/>`}return o}
// back(color) = drawn behind the circle; front() = drawn on top (before the face).
const FRUITS={
  none:{t:"ไม่แต่ง"},
  apple:{t:"แอปเปิล",front:()=>`<path d="M50 12 Q49 5 52 0" stroke="${STEM}" stroke-width="3" fill="none" stroke-linecap="round"/>`+leaf(52,4,-25)},
  peach:{t:"พีช",front:()=>`<path d="M50 10 Q45 16 47 25" stroke="${SHADE}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`+leaf(51,9,-35,LEAF2)},
  orange:{t:"ส้ม",front:()=>`<ellipse cx="50" cy="11" rx="3" ry="2" fill="${SHADE}"/>`+leaf(51,9,-30)+
    `<circle cx="76" cy="26" r="1.6" fill="${SHINE}"/><circle cx="82" cy="34" r="1.6" fill="${SHINE}"/><circle cx="75" cy="35" r="1.6" fill="${SHINE}"/>`},
  lemon:{t:"เลมอน",back:c=>`<ellipse cx="9" cy="50" rx="6" ry="4.5" fill="${c}"/><ellipse cx="91" cy="50" rx="6" ry="4.5" fill="${c}"/>`,front:()=>leaf(51,9,-25)},
  strawberry:{t:"สตรอว์เบอร์รี่",front:()=>F("M28 14 Q36 6 42 13 Q46 3 50 11 Q54 3 58 13 Q64 6 72 14 Q62 20 50 16 Q38 20 28 14Z",LEAF)+
    [[20,50],[80,50],[24,68],[76,68],[36,84],[64,84],[50,87]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="1.3" ry="2" fill="${SHINE}"/>`).join("")},
  cherry:{t:"เชอร์รี่",front:()=>`<path d="M50 11 Q53 -2 66 -6" stroke="${STEM}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`+leaf(63,-5,12)+
    `<ellipse cx="22" cy="38" rx="4.5" ry="2.6" fill="${SHINE}" transform="rotate(-50 22 38)"/>`},
  tomato:{t:"มะเขือเทศ",front:()=>F(star(50,12,5,11,4),LEAF)+`<path d="M50 11 L50 4" stroke="${LEAF}" stroke-width="2.6" stroke-linecap="round"/>`},
  mangosteen:{t:"มังคุด",front:()=>F("M50 13 C42 2 30 6 35 14 C27 13 28 21 37 20 C43 19 47 16 50 14 C53 16 57 19 63 20 C72 21 73 13 65 14 C70 6 58 2 50 13Z",LEAF)+
    `<path d="M50 9 L50 1" stroke="${STEM}" stroke-width="3" stroke-linecap="round"/>`},
  blueberry:{t:"บลูเบอร์รี่",front:()=>F(star(50,16,5,6,2.6),SHADE)},
  durian:{t:"ทุเรียน",back:c=>spikes(c),front:()=>`<path d="M50 4 L50 -4" stroke="${STEM}" stroke-width="3.4" stroke-linecap="round"/>`},
  pineapple:{t:"สับปะรด",front:()=>F("M50 16 L27 -1 L46 11Z M50 16 L73 -1 L54 11Z",LEAF2)+F("M50 16 Q42 4 39 -8 Q46 0 49 6 Q48 -6 50 -15 Q52 -6 51 6 Q54 0 61 -8 Q58 4 50 16Z",LEAF)+
    [[20,60],[80,60],[28,78],[72,78]].map(([x,y])=>L(`M${x-2.5} ${y-2.5} L${x+2.5} ${y+2.5} M${x+2.5} ${y-2.5} L${x-2.5} ${y+2.5}`,1.8).replaceAll(INK,SHADE)).join("")},
  watermelon:{t:"แตงโม",front:()=>`<g stroke="${SHADE}" stroke-width="4" fill="none" stroke-linecap="round"><path d="M24 20 Q18 35 22 50 Q18 65 24 80"/><path d="M14 38 Q11 50 14 64"/><path d="M76 20 Q82 35 78 50 Q82 65 76 80"/><path d="M86 38 Q89 50 86 64"/></g>`},
};

const PASTELS=["#E6F0B8","#F7C6DA","#BFDDF5","#F9CFA6","#BFE6C2","#FFFFFF","#FBE6A2","#DCD2F5","#F4B9B2","#C9EDE6"];

const EYES={
  dots:()=>D(38,44)+D(62,44), small:()=>D(40,45,2.3)+D(60,45,2.3), big:()=>D(38,44,5.5)+D(62,44,5.5),
  ovals:()=>`<ellipse cx="39" cy="44" rx="2.8" ry="5" fill="${INK}"/><ellipse cx="61" cy="44" rx="2.8" ry="5" fill="${INK}"/>`,
  shine:()=>D(38,44,5)+D(62,44,5)+`<circle cx="39.8" cy="42" r="1.7" fill="#fff"/><circle cx="63.8" cy="42" r="1.7" fill="#fff"/>`,
  uneven:()=>D(38,44,2.4)+D(62,44,5),
  sleepy:()=>L("M31 45 Q38 50 45 45 M55 45 Q62 50 69 45"),
  happy:()=>L("M31 47 Q38 40 45 47 M55 47 Q62 40 69 47"),
  lashes:()=>L("M31 45 Q38 50 45 45 M55 45 Q62 50 69 45 M33 47 L31 50 M38 48.5 L38 52 M43 47 L45 50 M57 47 L55 50 M62 48.5 L62 52 M67 47 L69 50",2.6),
  lid:()=>L("M31 41 L45 41 M55 41 L69 41",2.8)+D(38,45,2.8)+D(62,45,2.8),
  ring:()=>L("M38 37 a7 7 0 1 0 0.1 0 M62 37 a7 7 0 1 0 0.1 0",2.6)+D(39,45,2.4)+D(63,45,2.4),
  side:()=>L("M31 44 L45 44 M55 44 L69 44",2.8)+D(42,47,2.4)+D(66,47,2.4),
  up:()=>L("M38 37 a7 7 0 1 0 0.1 0 M62 37 a7 7 0 1 0 0.1 0",2.6)+D(38,40,2.4)+D(62,40,2.4),
  wink:()=>D(38,44)+L("M55 45 L69 45"),
  winkhappy:()=>L("M31 47 Q38 40 45 47")+L("M57 41 L67 45 L57 49"),
  squint:()=>L("M32 39 L43 44 L32 49 M68 39 L57 44 L68 49"),
  x:()=>L("M33 39 L43 49 M43 39 L33 49 M57 39 L67 49 M67 39 L57 49",2.8),
  star:()=>L("M33 39 L43 49 M43 39 L33 49 M38 37 L38 51 M57 39 L67 49 M67 39 L57 49 M62 37 L62 51",2.4),
  heart:()=>F("M38 50 C31 45 32 38 38 41 C44 38 45 45 38 50Z")+F("M62 50 C55 45 56 38 62 41 C68 38 69 45 62 50Z"),
  tear:()=>D(38,44)+D(62,44)+F("M37 50 Q34 56 37 58 Q40 56 37 50Z","#8CC4EE"),
};
const BROWS={
  none:()=>"", flat:()=>L("M31 33 L45 33 M55 33 L69 33",2.8), short:()=>L("M35 31 L41 31 M59 31 L65 31",2.8),
  thick:()=>L("M31 33 L45 32 M55 32 L69 33",4.6), angry:()=>L("M31 29 L45 36 M69 29 L55 36",2.8),
  worry:()=>L("M31 36 L45 30 M69 36 L55 30",2.8), arch:()=>L("M31 34 Q38 28 45 33 M55 33 Q62 28 69 34",2.8),
  high:()=>L("M32 28 Q38 24 44 28 M56 28 Q62 24 68 28",2.6), raise:()=>L("M31 33 L45 33 M55 31 Q62 24 69 30",2.8),
  wiggle:()=>L("M31 33 Q34.5 30 38 33 Q41.5 36 45 33 M55 33 Q58.5 30 62 33 Q65.5 36 69 33",2.6), one:()=>L("M30 33 Q50 28 70 33",2.8),
};
const NOSE={
  none:()=>"", hook:()=>L("M51 47 L47 57 L53 57",2.6), hookr:()=>L("M49 47 L53 57 L47 57",2.6), dot:()=>D(50,55,1.8),
  line:()=>L("M50 49 L50 57",2.6), side:()=>L("M48 50 Q55 54 49 58",2.6), holes:()=>D(47,56,1.5)+D(53,56,1.5),
  round:()=>L("M50 51 a3.2 3.2 0 1 0 0.1 0",2.4), v:()=>L("M46 53 L50 57 L54 53",2.6), j:()=>L("M50 47 L50 56 Q50 59 46 58",2.6),
};
const MOUTH={
  smile:()=>L("M38 64 Q50 74 62 64"), u:()=>L("M36 60 Q36 76 50 76 Q64 76 64 60"), small:()=>L("M44 66 Q50 70 56 65"),
  side:()=>L("M48 67 Q54 70 59 64"), flat:()=>L("M42 67 L58 67"), wavy:()=>L("M36 67 Q40 63 44 67 Q48 71 52 67 Q56 63 60 67 Q62 69 64 67"),
  o:()=>L("M50 62 a4.5 5.5 0 1 0 0.1 0",2.8), tiny:()=>`<ellipse cx="50" cy="67" rx="2.4" ry="3" fill="${INK}"/>`,
  frown:()=>L("M39 71 Q50 61 61 71"), open:()=>`<ellipse cx="50" cy="68" rx="9" ry="7" fill="${INK}"/>`,
  laugh:()=>F("M37 62 L63 62 Q62 78 50 78 Q38 78 37 62Z"), grin:()=>L("M37 62 L63 62 Q62 76 50 76 Q38 76 37 62Z M38 67 L62 67",2.6),
  smirk:()=>L("M40 67 Q52 70 61 62"), cat:()=>L("M40 64 Q45 70 50 64 Q55 70 60 64"),
  tongue:()=>L("M39 64 Q50 72 61 64")+F("M47 68.5 Q50 77 53 68.5Z","#F08FAE"), kiss:()=>L("M47 61 Q54 63 49 66 Q54 69 47 71",2.8),
};
const CHEEK={none:()=>"", pink:()=>`<ellipse cx="29" cy="58" rx="5.5" ry="3.2" fill="#F08FAE" opacity=".45"/><ellipse cx="71" cy="58" rx="5.5" ry="3.2" fill="#F08FAE" opacity=".45"/>`,
  lines:()=>L("M25 57 L28 54 M29 59 L32 56 M68 56 L71 59 M72 54 L75 57",1.8)};
const BOX={eyes:"26 30 48 30",brows:"26 21 48 20",nose:"36 42 28 20",mouth:"30 56 40 26",cheek:"20 48 60 16"};

// Day moods: only eyes + mouth (+ cheeks) change. The rest stays hers.
const MOODS=[
  {id:"own",t:"ปกติ",why:"หน้าที่เราเลือกเอง",f:s=>s},
  {id:"sleepy",t:"ง่วงๆ",why:"เช้า ยังไม่ได้บันทึก",f:s=>({...s,eyes:"lid",mouth:"tiny",zz:true})},
  {id:"happy",t:"ดีใจ",why:"ดื่มน้ำครบ / บันทึกครบ",f:s=>({...s,eyes:"happy",mouth:"u",cheek:"pink"})},
  {id:"gentle",t:"ใจดี",why:"กินเกินเป้า · ไม่เป็นไรนะ",f:s=>({...s,eyes:"sleepy",mouth:"small",cheek:"pink"})},
];

function body(c){
  const fr=FRUITS[c.fruit];
  const edge=c.color.toLowerCase()==="#ffffff"?"#e2ddd5":"none";
  return (fr.back?fr.back(c.color):"")+`<path d="${BODY}" fill="${c.color}" stroke="${edge}" stroke-width="1.5"/>`+(fr.front?fr.front():"");
}
function face(c){
  let f=CHEEK[c.cheek]()+BROWS[c.brows]()+EYES[c.eyes]()+NOSE[c.nose]()+MOUTH[c.mouth]();
  if(c.zz)f+=`<text x="72" y="30" font-size="12" font-weight="700" fill="#b9b0a6" font-family="system-ui">z</text><text x="80" y="22" font-size="9" font-weight="700" fill="#cfc7bd" font-family="system-ui">z</text>`;
  return body(c)+f;
}

let st={fruit:"orange",color:"#F9CFA6",eyes:"dots",brows:"none",nose:"hook",mouth:"smile",cheek:"pink"};
let moodOn=true;
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const keys=o=>Object.keys(o);
function randomFace(){return{fruit:rnd(keys(FRUITS)),color:rnd(PASTELS),eyes:rnd(keys(EYES)),brows:rnd(keys(BROWS)),nose:rnd(keys(NOSE)),mouth:rnd(["smile","u","small","side","o","tiny","cat","smirk","tongue","grin"]),cheek:rnd(["none","pink","pink"])}}

document.getElementById("wall").innerHTML=keys(FRUITS).slice(1).concat(["none","none","none"]).map((fruit,i)=>{
  const r=randomFace();return `<svg viewBox="-8 -16 116 116">${face({...r,fruit,color:PASTELS[i%PASTELS.length]})}</svg>`}).join("");

function chips(id,table,key){
  const r=document.getElementById(id);r.innerHTML="";
  keys(table).forEach(v=>{
    const b=document.createElement("button");b.className="part";b.dataset.v=v;
    b.innerHTML=v==="none"?'<span class="none">ไม่มี</span>':`<svg viewBox="${BOX[key]}">${table[v]()}</svg>`;
    b.onclick=()=>{st[key]=v;render()};r.appendChild(b);
  });
}
function fruitChips(){
  const r=document.getElementById("fruit");r.innerHTML="";
  keys(FRUITS).forEach(v=>{
    const b=document.createElement("button");b.className="part fruit"+(st.fruit===v?" on":"");b.dataset.v=v;
    b.innerHTML=`<svg viewBox="-8 -16 116 116">${body({...st,fruit:v})}</svg><small>${FRUITS[v].t}</small>`;
    b.onclick=()=>{st.fruit=v;render()};r.appendChild(b);
  });
}

[["eyes",EYES],["brows",BROWS],["nose",NOSE],["mouth",MOUTH],["cheek",CHEEK]].forEach(([k,t])=>chips(k,t,k));

function colors(){
  const cr=document.getElementById("color");cr.innerHTML="";
  const list=PASTELS;
  list.forEach(c=>{const b=document.createElement("button");b.className="sw"+(c===st.color?" on":"");b.style.background=c;b.onclick=()=>{st.color=c;render()};cr.appendChild(b)});
  const custom=!list.includes(st.color);
  const w=document.createElement("label");w.className="any"+(custom?" on":"");
  if(custom)w.style.background=st.color;
  w.innerHTML=`<input type="color" value="${st.color}" aria-label="เลือกสีอื่น">`;
  w.querySelector("input").onchange=w.querySelector("input").oninput=e=>{st.color=e.target.value;paint();w.style.background=st.color;w.classList.add("on");cr.querySelectorAll(".sw").forEach(s=>s.classList.remove("on"))};
  cr.appendChild(w);
  const t=document.createElement("span");t.className="anylab";t.textContent="สีอื่นๆ";cr.appendChild(t);
}
function paint(){
  document.getElementById("pv").innerHTML=face(st);
  fruitChips();
  document.getElementById("moods").innerHTML=MOODS.map(m=>{
    const s=moodOn?m.f(st):st;
    return `<div class="mood"><svg viewBox="-8 -16 116 116">${face(s)}</svg><b>${m.t}</b><span>${m.why}</span></div>`}).join("");
}
function render(){
  paint();colors();
  ["eyes","brows","nose","mouth","cheek"].forEach(k=>document.querySelectorAll("#"+k+" button").forEach(b=>b.classList.toggle("on",b.dataset.v===st[k])));
}
document.getElementById("dice").onclick=()=>{st=randomFace();render()};
document.getElementById("moodOn").onclick=e=>{moodOn=!moodOn;e.currentTarget.classList.toggle("on",moodOn);paint()};
render();
</script>
</body>
</html>
