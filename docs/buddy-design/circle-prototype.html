<!doctype html>
<!--
  Circle doodle-face buddy — DRAFT prototype (2026-11-14).
  Yani asked: round circles in many colors (she picks the color), faces drawn as simple hand-drawn lines.
  Style only, inspired by a reference she shared; every face part here is our own drawing.
  Two color sets to choose between: A bright, B soft pastel.
-->
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Circle buddy prototype</title>
<style>
:root{--bg:#f8f6f3;--ink:#2a2622;--muted:#8b857e;--line:#ebe6e0}
*{box-sizing:border-box}
body{font-family:system-ui,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:16px;max-width:560px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 2px}
p.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;min-height:44px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:15px}
.tabs button.on{background:#ffe59a;border-color:var(--ink);font-weight:600}
.wall{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:12px;margin-bottom:16px}
.wall svg{width:100%;height:auto}
.maker{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px}
.pv{position:sticky;top:0;z-index:2;display:flex;justify-content:center;background:var(--bg);border-radius:16px;padding:10px;margin-bottom:12px}
.lab{font-size:14px;color:var(--muted);margin:10px 2px 6px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.row button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:2px;width:52px;height:52px}
.row button.on{border-color:var(--ink);background:#fff7d6;box-shadow:0 0 0 1px var(--ink)}
.row button svg{width:100%;height:100%}
.sw{width:40px!important;height:40px!important;border-radius:50%!important;padding:0!important}
.sw.on{outline:2px solid var(--ink);outline-offset:2px;box-shadow:none!important}
.dice{margin-top:14px;width:100%;min-height:48px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-size:16px}
</style>
</head>
<body>
<h1>วงกลมหน้าวาดมือ</h1>
<p class="sub">ลองเลือกชุดสี แล้วแต่งหน้าเองข้างล่าง</p>
<div class="tabs"><button id="tA">A · สีสด</button><button id="tB">B · สีพาสเทล</button></div>
<div class="wall" id="wall"></div>

<div class="maker">
  <div class="pv"><svg id="pv" width="150" height="150" viewBox="0 0 100 100"></svg></div>
  <div class="lab">สี</div><div class="row" id="color"></div>
  <div class="lab">ตา</div><div class="row" id="eyes"></div>
  <div class="lab">คิ้ว</div><div class="row" id="brows"></div>
  <div class="lab">จมูก</div><div class="row" id="nose"></div>
  <div class="lab">ปาก</div><div class="row" id="mouth"></div>
  <button class="dice" id="dice">🎲 สุ่มหน้า</button>
</div>

<script>
const INK="#2a1d1a";
const L=(d,w=3.2)=>`<path d="${d}" stroke="${INK}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
const D=(x,y,r=3.2)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${INK}"/>`;
// Slightly hand-cut circle (not a perfect circle).
const BODY="M50 9 C73 9 91 27 91 50 C91 73 74 91 50 91 C27 91 9 74 9 51 C9 28 26 9 50 9Z";

const PALETTES={
  A:["#CFE57C","#F58DBE","#6DB3EA","#F7963A","#52C463","#FFFFFF","#F6D44C","#B79CEB"],
  B:["#E6F0B8","#F7C6DA","#BFDDF5","#F9CFA6","#BFE6C2","#FFFFFF","#FBE6A2","#DCD2F5"],
};

// Our own face parts, drawn as simple doodle lines.
const EYES={
  dots:()=>D(38,44)+D(62,44),
  small:()=>D(40,45,2.4)+D(60,45,2.4),
  big:()=>D(38,44,5.5)+D(62,44,5.5),
  sleepy:()=>L("M31 45 Q38 50 45 45 M55 45 Q62 50 69 45"),
  happy:()=>L("M31 47 Q38 40 45 47 M55 47 Q62 40 69 47"),
  ring:()=>L("M38 37 a7 7 0 1 0 0.1 0 M62 37 a7 7 0 1 0 0.1 0",2.6)+D(39,45,2.4)+D(63,45,2.4),
  wink:()=>D(38,44)+L("M55 45 L69 45"),
  star:()=>L("M33 39 L43 49 M43 39 L33 49 M38 37 L38 51 M57 39 L67 49 M67 39 L57 49 M62 37 L62 51",2.4),
  side:()=>L("M31 44 L45 44 M55 44 L69 44",2.8)+D(42,47,2.4)+D(66,47,2.4),
};
const BROWS={
  none:()=>"",
  flat:()=>L("M31 33 L45 33 M55 33 L69 33",2.8),
  angry:()=>L("M31 29 L45 36 M69 29 L55 36",2.8),
  worry:()=>L("M31 36 L45 30 M69 36 L55 30",2.8),
  arch:()=>L("M31 34 Q38 28 45 33 M55 33 Q62 28 69 34",2.8),
  one:()=>L("M30 33 Q50 28 70 33",2.8),
};
const NOSE={
  none:()=>"",
  hook:()=>L("M51 47 L47 57 L53 57",2.6),
  dot:()=>D(50,55,1.8),
  line:()=>L("M50 49 L50 57",2.6),
  side:()=>L("M48 50 Q55 54 49 58",2.6),
};
const MOUTH={
  smile:()=>L("M38 64 Q50 74 62 64"),
  u:()=>L("M36 60 Q36 76 50 76 Q64 76 64 60"),
  small:()=>L("M44 66 Q50 70 56 65"),
  flat:()=>L("M42 67 L58 67"),
  wavy:()=>L("M36 67 Q40 63 44 67 Q48 71 52 67 Q56 63 60 67 Q62 69 64 67"),
  o:()=>L("M50 62 a4.5 5.5 0 1 0 0.1 0",2.8),
  frown:()=>L("M39 71 Q50 61 61 71"),
  open:()=>`<ellipse cx="50" cy="68" rx="9" ry="7" fill="${INK}"/>`,
  smirk:()=>L("M40 67 Q52 70 61 62"),
};

function face(c){
  const edge=c.color.toLowerCase()==="#ffffff"?"#e2ddd5":"none";
  return `<path d="${BODY}" fill="${c.color}" stroke="${edge}" stroke-width="1.5"/>`+
    BROWS[c.brows]()+EYES[c.eyes]()+NOSE[c.nose]()+MOUTH[c.mouth]();
}

let pal="A";
let st={color:PALETTES.A[0],eyes:"dots",brows:"none",nose:"hook",mouth:"smile"};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const keys=o=>Object.keys(o);
function randomFace(p){return{color:rnd(PALETTES[p]),eyes:rnd(keys(EYES)),brows:rnd(keys(BROWS)),nose:rnd(keys(NOSE)),mouth:rnd(keys(MOUTH))}}

// A fixed "wall" of faces so both palettes show the same faces.
let seeds=Array.from({length:24},()=>randomFace("A"));
function drawWall(){
  document.getElementById("wall").innerHTML=seeds.map((s,i)=>{
    const color=PALETTES[pal][PALETTES.A.indexOf(s.color)];
    return `<svg viewBox="0 0 100 100">${face({...s,color})}</svg>`;
  }).join("");
}
function chips(id,table,key){
  const r=document.getElementById(id);r.innerHTML="";
  keys(table).forEach(v=>{
    const b=document.createElement("button");b.dataset.v=v;
    b.innerHTML=`<svg viewBox="0 0 100 100">${face({...st,[key]:v,color:"#f3efe9"})}</svg>`;
    b.onclick=()=>{st[key]=v;render()};r.appendChild(b);
  });
}
function render(){
  document.getElementById("pv").innerHTML=face(st);
  const cr=document.getElementById("color");cr.innerHTML="";
  PALETTES[pal].forEach(c=>{const b=document.createElement("button");b.className="sw"+(c===st.color?" on":"");b.style.background=c;b.style.border="1px solid #e2ddd5";b.onclick=()=>{st.color=c;render()};cr.appendChild(b)});
  chips("eyes",EYES,"eyes");chips("brows",BROWS,"brows");chips("nose",NOSE,"nose");chips("mouth",MOUTH,"mouth");
  ["eyes","brows","nose","mouth"].forEach(k=>document.querySelectorAll("#"+k+" button").forEach(b=>b.classList.toggle("on",b.dataset.v===st[k])));
  document.getElementById("tA").classList.toggle("on",pal==="A");
  document.getElementById("tB").classList.toggle("on",pal==="B");
  drawWall();
}
function setPal(p){const i=PALETTES[pal].indexOf(st.color);pal=p;st.color=PALETTES[p][i<0?0:i];render()}
document.getElementById("tA").onclick=()=>setPal("A");
document.getElementById("tB").onclick=()=>setPal("B");
document.getElementById("dice").onclick=()=>{st=randomFace(pal);render()};
render();
</script>
</body>
</html>
