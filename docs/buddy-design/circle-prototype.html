<!doctype html>
<!--
  Circle doodle-face buddy — DRAFT prototype v2 (2026-11-14).
  Yani asked: round circles, she picks the color; faces drawn as simple hand-drawn lines.
  v1 → she picked B (soft pastel). v2 changes she asked for:
   - a picker for ANY color (plus the pastel presets)
   - each choice button shows ONLY that part (just the eyes, just the mouth…), no whole face
   - more choices for eyes, brows, nose, mouth
  Style only, inspired by a reference she shared; every face part here is our own drawing.
-->
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Circle buddy prototype</title>
<style>
:root{--bg:#f8f6f3;--ink:#2a2622;--muted:#8b857e;--line:#ebe6e0}
*{box-sizing:border-box}
body{font-family:system-ui,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:16px;max-width:560px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 2px}
p.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.wall{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:12px;margin-bottom:16px}
.wall svg{width:100%;height:auto}
.maker{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px}
.pv{position:sticky;top:0;z-index:2;display:flex;justify-content:center;background:var(--bg);border-radius:16px;padding:10px;margin-bottom:12px}
.lab{font-size:14px;color:var(--muted);margin:14px 2px 6px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.part{border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px;width:64px;height:46px}
.part.on{border-color:var(--ink);background:#fff7d6;box-shadow:0 0 0 1px var(--ink)}
.part svg{width:100%;height:100%;display:block}
.part .none{font-size:13px;color:var(--muted)}
.sw{width:40px;height:40px;border-radius:50%;border:1px solid #e2ddd5;padding:0}
.sw.on{outline:2px solid var(--ink);outline-offset:2px}
.any{position:relative;width:40px;height:40px;border-radius:50%;overflow:hidden;border:1px solid #e2ddd5;
  background:conic-gradient(#f88,#fd8,#bf8,#8fd,#8cf,#a8f,#f8d,#f88)}
.any.on{outline:2px solid var(--ink);outline-offset:2px}
.any input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.anylab{font-size:13px;color:var(--muted);align-self:center;margin-left:2px}
.dice{margin-top:16px;width:100%;min-height:48px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-size:16px}
</style>
</head>
<body>
<h1>วงกลมหน้าวาดมือ · พาสเทล</h1>
<p class="sub">เลือกสี (สีไหนก็ได้) แล้วแต่งหน้าเองข้างล่าง</p>
<div class="wall" id="wall"></div>

<div class="maker">
  <div class="pv"><svg id="pv" width="150" height="150" viewBox="0 0 100 100"></svg></div>
  <div class="lab">สี</div>
  <div class="row" id="color"></div>
  <div class="lab">ตา</div><div class="row" id="eyes"></div>
  <div class="lab">คิ้ว</div><div class="row" id="brows"></div>
  <div class="lab">จมูก</div><div class="row" id="nose"></div>
  <div class="lab">ปาก</div><div class="row" id="mouth"></div>
  <button class="dice" id="dice">🎲 สุ่มหน้า</button>
</div>

<script>
const INK="#2a1d1a";
const L=(d,w=3.2)=>`<path d="${d}" stroke="${INK}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
const D=(x,y,r=3.2)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${INK}"/>`;
const F=(d,c=INK)=>`<path d="${d}" fill="${c}"/>`;
// Slightly hand-cut circle (not a perfect circle).
const BODY="M50 9 C73 9 91 27 91 50 C91 73 74 91 50 91 C27 91 9 74 9 51 C9 28 26 9 50 9Z";

const PASTELS=["#E6F0B8","#F7C6DA","#BFDDF5","#F9CFA6","#BFE6C2","#FFFFFF","#FBE6A2","#DCD2F5","#F4B9B2","#C9EDE6"];

// Our own face parts, drawn as simple doodle lines.
const EYES={
  dots:()=>D(38,44)+D(62,44),
  small:()=>D(40,45,2.3)+D(60,45,2.3),
  big:()=>D(38,44,5.5)+D(62,44,5.5),
  ovals:()=>`<ellipse cx="39" cy="44" rx="2.8" ry="5" fill="${INK}"/><ellipse cx="61" cy="44" rx="2.8" ry="5" fill="${INK}"/>`,
  shine:()=>D(38,44,5)+D(62,44,5)+`<circle cx="39.8" cy="42" r="1.7" fill="#fff"/><circle cx="63.8" cy="42" r="1.7" fill="#fff"/>`,
  uneven:()=>D(38,44,2.4)+D(62,44,5),
  sleepy:()=>L("M31 45 Q38 50 45 45 M55 45 Q62 50 69 45"),
  happy:()=>L("M31 47 Q38 40 45 47 M55 47 Q62 40 69 47"),
  lashes:()=>L("M31 45 Q38 50 45 45 M55 45 Q62 50 69 45 M33 47 L31 50 M38 48.5 L38 52 M43 47 L45 50 M57 47 L55 50 M62 48.5 L62 52 M67 47 L69 50",2.6),
  lid:()=>L("M31 41 L45 41 M55 41 L69 41",2.8)+D(38,45,2.8)+D(62,45,2.8),
  ring:()=>L("M38 37 a7 7 0 1 0 0.1 0 M62 37 a7 7 0 1 0 0.1 0",2.6)+D(39,45,2.4)+D(63,45,2.4),
  side:()=>L("M31 44 L45 44 M55 44 L69 44",2.8)+D(42,47,2.4)+D(66,47,2.4),
  up:()=>L("M38 37 a7 7 0 1 0 0.1 0 M62 37 a7 7 0 1 0 0.1 0",2.6)+D(38,40,2.4)+D(62,40,2.4),
  wink:()=>D(38,44)+L("M55 45 L69 45"),
  winkhappy:()=>L("M31 47 Q38 40 45 47")+L("M57 41 L67 45 L57 49"),
  squint:()=>L("M32 39 L43 44 L32 49 M68 39 L57 44 L68 49"),
  x:()=>L("M33 39 L43 49 M43 39 L33 49 M57 39 L67 49 M67 39 L57 49",2.8),
  star:()=>L("M33 39 L43 49 M43 39 L33 49 M38 37 L38 51 M57 39 L67 49 M67 39 L57 49 M62 37 L62 51",2.4),
  heart:()=>F("M38 50 C31 45 32 38 38 41 C44 38 45 45 38 50Z")+F("M62 50 C55 45 56 38 62 41 C68 38 69 45 62 50Z"),
  tear:()=>D(38,44)+D(62,44)+F("M37 50 Q34 56 37 58 Q40 56 37 50Z","#8CC4EE"),
};
const BROWS={
  none:()=>"",
  flat:()=>L("M31 33 L45 33 M55 33 L69 33",2.8),
  short:()=>L("M35 31 L41 31 M59 31 L65 31",2.8),
  thick:()=>L("M31 33 L45 32 M55 32 L69 33",4.6),
  angry:()=>L("M31 29 L45 36 M69 29 L55 36",2.8),
  worry:()=>L("M31 36 L45 30 M69 36 L55 30",2.8),
  arch:()=>L("M31 34 Q38 28 45 33 M55 33 Q62 28 69 34",2.8),
  high:()=>L("M32 28 Q38 24 44 28 M56 28 Q62 24 68 28",2.6),
  raise:()=>L("M31 33 L45 33 M55 31 Q62 24 69 30",2.8),
  wiggle:()=>L("M31 33 Q34.5 30 38 33 Q41.5 36 45 33 M55 33 Q58.5 30 62 33 Q65.5 36 69 33",2.6),
  one:()=>L("M30 33 Q50 28 70 33",2.8),
};
const NOSE={
  none:()=>"",
  hook:()=>L("M51 47 L47 57 L53 57",2.6),
  hookr:()=>L("M49 47 L53 57 L47 57",2.6),
  dot:()=>D(50,55,1.8),
  line:()=>L("M50 49 L50 57",2.6),
  side:()=>L("M48 50 Q55 54 49 58",2.6),
  holes:()=>D(47,56,1.5)+D(53,56,1.5),
  round:()=>L("M50 51 a3.2 3.2 0 1 0 0.1 0",2.4),
  v:()=>L("M46 53 L50 57 L54 53",2.6),
  j:()=>L("M50 47 L50 56 Q50 59 46 58",2.6),
};
const MOUTH={
  smile:()=>L("M38 64 Q50 74 62 64"),
  u:()=>L("M36 60 Q36 76 50 76 Q64 76 64 60"),
  small:()=>L("M44 66 Q50 70 56 65"),
  side:()=>L("M48 67 Q54 70 59 64"),
  flat:()=>L("M42 67 L58 67"),
  wavy:()=>L("M36 67 Q40 63 44 67 Q48 71 52 67 Q56 63 60 67 Q62 69 64 67"),
  o:()=>L("M50 62 a4.5 5.5 0 1 0 0.1 0",2.8),
  tiny:()=>`<ellipse cx="50" cy="67" rx="2.4" ry="3" fill="${INK}"/>`,
  frown:()=>L("M39 71 Q50 61 61 71"),
  open:()=>`<ellipse cx="50" cy="68" rx="9" ry="7" fill="${INK}"/>`,
  laugh:()=>F("M37 62 L63 62 Q62 78 50 78 Q38 78 37 62Z"),
  grin:()=>L("M37 62 L63 62 Q62 76 50 76 Q38 76 37 62Z M38 67 L62 67",2.6),
  smirk:()=>L("M40 67 Q52 70 61 62"),
  cat:()=>L("M40 64 Q45 70 50 64 Q55 70 60 64"),
  tongue:()=>L("M39 64 Q50 72 61 64")+F("M47 68.5 Q50 77 53 68.5Z","#F08FAE"),
  kiss:()=>L("M47 61 Q54 63 49 66 Q54 69 47 71",2.8),
};
// Which part of the 100x100 face each choice button zooms into.
const BOX={eyes:"26 30 48 30",brows:"26 21 48 20",nose:"36 42 28 20",mouth:"30 56 40 26"};

function face(c){
  const edge=c.color.toLowerCase()==="#ffffff"?"#e2ddd5":"none";
  return `<path d="${BODY}" fill="${c.color}" stroke="${edge}" stroke-width="1.5"/>`+
    BROWS[c.brows]()+EYES[c.eyes]()+NOSE[c.nose]()+MOUTH[c.mouth]();
}

let st={color:PASTELS[0],eyes:"dots",brows:"none",nose:"hook",mouth:"smile"};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const keys=o=>Object.keys(o);
function randomFace(){return{color:rnd(PASTELS),eyes:rnd(keys(EYES)),brows:rnd(keys(BROWS)),nose:rnd(keys(NOSE)),mouth:rnd(keys(MOUTH))}}

const seeds=Array.from({length:24},randomFace);
document.getElementById("wall").innerHTML=seeds.map(s=>`<svg viewBox="0 0 100 100">${face(s)}</svg>`).join("");

// Choice buttons: ONLY that part, no face around it.
function chips(id,table,key){
  const r=document.getElementById(id);r.innerHTML="";
  keys(table).forEach(v=>{
    const b=document.createElement("button");b.className="part";b.dataset.v=v;
    b.innerHTML=v==="none"?'<span class="none">ไม่มี</span>':`<svg viewBox="${BOX[key]}">${table[v]()}</svg>`;
    b.onclick=()=>{st[key]=v;render()};r.appendChild(b);
  });
}
["eyes","brows","nose","mouth"].forEach(k=>chips(k,{eyes:EYES,brows:BROWS,nose:NOSE,mouth:MOUTH}[k],k));

function colors(){
  const cr=document.getElementById("color");cr.innerHTML="";
  PASTELS.forEach(c=>{const b=document.createElement("button");b.className="sw"+(c===st.color?" on":"");b.style.background=c;b.onclick=()=>{st.color=c;render()};cr.appendChild(b)});
  // Any color in the world: the phone's own color picker.
  const custom=!PASTELS.includes(st.color);
  const w=document.createElement("label");w.className="any"+(custom?" on":"");
  if(custom)w.style.background=st.color;
  w.innerHTML=`<input type="color" value="${st.color.length===7?st.color:"#ffffff"}" aria-label="เลือกสีอื่น">`;
  w.querySelector("input").oninput=e=>{st.color=e.target.value;document.getElementById("pv").innerHTML=face(st);w.style.background=st.color;w.classList.add("on");cr.querySelectorAll(".sw").forEach(s=>s.classList.remove("on"))};
  cr.appendChild(w);
  const t=document.createElement("span");t.className="anylab";t.textContent="สีอื่นๆ";cr.appendChild(t);
}
function render(){
  document.getElementById("pv").innerHTML=face(st);
  colors();
  ["eyes","brows","nose","mouth"].forEach(k=>document.querySelectorAll("#"+k+" button").forEach(b=>b.classList.toggle("on",b.dataset.v===st[k])));
}
document.getElementById("dice").onclick=()=>{st=randomFace();render()};
render();
</script>
</body>
</html>
